<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="/images/logo.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><title>Contact - S.R.M. Traders</title></head>
<body>
<header class="hdr" id="header"></header>
<main class="wrap section two"><div><h1>Contact us</h1>
<p>Call or WhatsApp us for bulk prices, logo printing and delivery dates.</p>
<p id="cinfo"></p></div>
<form class="box" id="cform"><h3>Send an enquiry on WhatsApp</h3>
<input class="input" name="name" required placeholder="Your name *">
<input class="input" name="phone" placeholder="Phone number">
<textarea class="input" name="message" rows="4" required placeholder="Product, quantity, logo details"></textarea>
<button class="btn btn-green">Send on WhatsApp</button></form></main>
<footer class="foot" id="footer"></footer>
<script src="/js/site.js"></script>
</body></html>
